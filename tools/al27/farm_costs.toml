# Cost model of the 27Al response farm planner (tools/al27/farm_plan.py).
# `seconds` are MEASURED (or placeholder) wall seconds of one item of the
# given kind on ONE rank, summed over the stored Omegas; `[model]` holds the
# weights the BINARY uses to assign items to ranks (ItemCost = num_omegas x
# CommutatorWeight(rank L) in src/imsrg/driver/transform/farm.cc). Keep
# [model] in step with the binary; update `seconds` after each farm test.

[model]
# W(L)/W(0) of CommutatorWeight at emax 10, L = 0..5 (design/50 section 6.1,
# from the binary, 2026-11-26). TCM is a scalar: weight of L = 0.
weights = [1.0, 1.97, 2.86, 3.61, 4.20, 4.57]
tcm_weight = 1.0

[cpu]
ranks_per_node = 8   # one rank per GCD-sized share (design/50 section 6)
threads_per_rank = 7 # 7 cores per rank, 8th of each L3 region reserved
setup_s = 60         # PLACEHOLDER: per-job start-up, Omegas read, MPI init

[cpu.seconds]
# Measured 2026-11-26, frontier-cpu-release, N2LOsat native Omegas, 1 rank x
# 7 threads: L0 FM0p_150 27.2 s, L1 FSigmap1n_150 373 s, TCM 989 s (imsrg-c,
# farm-test1); L2-L5 from job 6006648 (8 ranks on one batch node, output
# mtimes): FM2p_150 747 s, FPhipp2n_600 721 s, FSigmap3p_150 1179 s,
# FDelta3n_600 1139 s, FM4p_150 1391 s, FPhitp4n_600 1342 s, FSigmap5p_150
# 1693 s, FDelta5n_1050 1636 s. Job 6006462 (8 ranks per node): L1 ~430 s.
L0 = 27.2
L1 = 430.0
L2 = 750.0
L3 = 1180.0
L4 = 1400.0
L5 = 1700.0
TCM = 989.0
# Per-family overrides win over the L-kind, e.g.
# FSigmap5 = 300.0

[hip]
ranks_per_node = 8   # one rank per GCD
threads_per_rank = 7
setup_s = 60         # PLACEHOLDER, as cpu

[hip.seconds]
# PLACEHOLDERS: cpu / 10 (assumed GPU speedup; no hip measurement yet).
L0 = 2.7
L1 = 10.638
L2 = 15.444
L3 = 19.494
L4 = 22.68
L5 = 24.678
TCM = 30.0
