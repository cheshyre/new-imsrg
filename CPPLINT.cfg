# cpplint configuration (design/17-code-style.md section 4). cpplint is a lint, not an oracle:
# every filter below has a reason, and justified exceptions in the code use
# `// NOLINT(<category>)` with a reason.
#   whitespace/indent_namespace, whitespace/braces, whitespace/parens: their findings contradict
#     clang-format's output (continuation lines inside namespaces, `std::errc{}`, macro parameter
#     lists); clang-format is the formatting authority.
#   build/c++17: <filesystem> is allowed outside kernels and numerics (design/17 section 3).
#   includeorder=standardcfirst: otherwise every <x.h> (nanobind, gtest, MPI, zlib) counts as a
#     C system header.
set noparent
linelength=80
root=src
extensions=h,cc
headers=h
includeorder=standardcfirst
filter=-whitespace/indent_namespace,-whitespace/braces,-whitespace/parens,-build/c++17
